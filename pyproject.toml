[project]
name = "sec10k"
version = "0.1.0"
description = "SEC 10-K item-level segmentation pipeline — certified-complete ruler (Stage 1) + invariant gate (Stage 3)"
readme = "README.md"
requires-python = ">=3.11"
# Core deps are intentionally tiny: the evaluator must be able to run the
# core (Stage 1-3) with zero secrets and a one-line install. No API key,
# ever. Stage 4 (LLM, optional, default OFF) would add anthropic under an
# extra — not part of this milestone.
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
# Optional HTML-robustness fallback. The core normalizer uses the stdlib
# position-aware html.parser (needed for the byte-offset provenance map);
# these libraries are a cross-validation / fallback path, not required.
html-robust = ["selectolax>=0.3", "lxml>=5"]
dev = ["pytest>=8"]

[project.scripts]
sec10k = "sec10k.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
